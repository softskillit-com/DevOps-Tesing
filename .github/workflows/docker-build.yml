# ============================================================
# Workflow ka naam — GitHub UI ke "Actions" tab mein yehi dikhega
# ============================================================
name: Build and Push Docker Image

# ============================================================
# YEH WORKFLOW KAB CHALEGA
# ============================================================
on:
  # Jab bhi "main" ya "develop" branch pe naya code push/merge ho
  push:
    branches:
      - main
      - develop

  # Jab bhi "develop" ki taraf koi Pull Request khule ya update ho
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    # GitHub ka apna free virtual Ubuntu machine — isi pe sab steps chalenge
    runs-on: ubuntu-latest

    # Is workflow ko yeh permissions chahiye:
    permissions:
      contents: read     # repo ka code padhne ke liye
      packages: write     # GHCR (GitHub Container Registry) pe image publish karne ke liye

    steps:

      # ------------------------------------------------------
      # Step 1: Repo ka code is virtual machine pe download karo
      # ------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Step 2: GHCR mein login karo (SIRF push event pe, PR pe nahi)
      # ------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}          # tumhara GitHub username, apne aap milta hai
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub khud yeh token provide karta hai, kuch banane ki zarurat nahi

      # ------------------------------------------------------
      # Step 3: Docker ka advanced build engine setup karo
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # Step 4: Asal Docker image build karo (aur push bhi, agar push event ho)
      # ------------------------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./web-git
          # ^ IMPORTANT: Dockerfile is subfolder ke andar hai (root mein nahi),
          #   isliye path yahan specify karna zaroori hai

          push: ${{ github.event_name == 'push' }}
          # ^ PR pe sirf "test build" hoga (false), asal push/merge pe publish hoga (true)

          tags: ghcr.io/${{ github.repository_owner }}/my-site:latest
          # ^ Image ka final naam GHCR pe

          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ^ Purani build layers cache karta hai, taake agli baar build fast ho

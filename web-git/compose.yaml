services:
  web:
    image: my-site:local
    container_name: my-site
    ports:
      - "8086:80"        # host:container -> visit http://localhost:8086
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"      # max half a CPU core
          memory: "128M"   # max 128 MB RAM
